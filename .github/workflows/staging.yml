name: Deploy to Staging

# PR previews come from Netlify Git. Keep this workflow manual so a second
# GitHub Actions preview cannot overwrite functions.

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  deployments: write
  statuses: write

concurrency:
  group: staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  test-build-deploy:
    if: ${{ vars.ENABLE_GH_RUNNERS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write
      deployments: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run type-check

      - name: Parse serverless functions
        run: npm run verify:functions

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_AUTH_PROVIDER: ${{ secrets.VITE_AUTH_PROVIDER || 'local' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_STRIPE_PRICE_HIPAA_ESSENTIAL: ${{ secrets.VITE_STRIPE_PRICE_HIPAA_ESSENTIAL }}
          VITE_STRIPE_PRICE_HIPAA_PROFESSIONAL: ${{ secrets.VITE_STRIPE_PRICE_HIPAA_PROFESSIONAL }}
          VITE_STRIPE_PRICE_RANSOMWARE_ESSENTIAL: ${{ secrets.VITE_STRIPE_PRICE_RANSOMWARE_ESSENTIAL }}
          VITE_STRIPE_PRICE_RANSOMWARE_PROFESSIONAL: ${{ secrets.VITE_STRIPE_PRICE_RANSOMWARE_PROFESSIONAL }}
          VITE_STRIPE_PRICE_CONTINUITY_ESSENTIAL: ${{ secrets.VITE_STRIPE_PRICE_CONTINUITY_ESSENTIAL }}
          VITE_STRIPE_PRICE_CONTINUITY_PROFESSIONAL: ${{ secrets.VITE_STRIPE_PRICE_CONTINUITY_PROFESSIONAL }}
          VITE_GA_TRACKING_ID: ${{ secrets.VITE_GA_TRACKING_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_BASE_URL: ${{ secrets.VITE_APP_BASE_URL || 'https://www.medisoluce.com' }}
          VITE_ENABLE_BILLING: ${{ secrets.VITE_ENABLE_BILLING || 'false' }}
          VITE_ENABLE_ANALYTICS: ${{ secrets.VITE_ENABLE_ANALYTICS }}
          VITE_ENABLE_ERROR_TRACKING: ${{ secrets.VITE_ENABLE_ERROR_TRACKING }}

      - name: Skip Netlify preview when credentials are missing
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID not set; skipping preview deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Preview to Netlify
        if: steps.netlify.outputs.skip != 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli deploy --dir=dist --functions=netlify/functions --message "preview ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --json > /tmp/netlify-deploy.json
          url=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/netlify-deploy.json','utf8')).deploy_url || '')")
          echo "Preview URL: $url"
          echo "### Netlify preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
